name: bootstrap-project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message != 'Bootstrap project files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project archive
        run: |
          base64 -d .bootstrap/project.tar.gz.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap project files"
          git push
