name: bootstrap-project

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and expand project archive
        run: |
          cat .bootstrap/chunk_*.txt > /tmp/project.tar.gz.b64
          base64 -d /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          gzip -t /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/ci.yml
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap project files"
          git push
